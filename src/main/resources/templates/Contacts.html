<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — JobTracker</title>
    <link rel="stylesheet" th:href="@{/css/contacts.css}">
    <script th:src="@{/js/darkmode.js}"></script>
</head>
<body>

<header>
    <div class="header-brand">
        <img th:src="@{/images/886e770a-b523-4bc5-b893-a6c2272e507c.png}"
             alt="JobTracker logo" class="header-logo">
        <span class="header-title">JobTracker</span>
    </div>
    <nav class="header-nav">
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/Applications}">Applications</a>
        <a th:href="@{/Settings}">Settings</a>
        <a th:href="@{/Contacts}" class="active">Contacts</a>
    </nav>
    <img th:src="@{/images/Depth 4, Frame 1.png}"
         alt="Profile" class="header-avatar">
</header>

<main class="contacts-main">
    <h1 class="contacts-heading">Contact</h1>

    <div class="contact-card">
        <img th:src="@{/images/Depth 4, Frame 1.png}"
             alt="Peter Bekana" class="contact-avatar">
        <div class="contact-info">
            <p class="contact-name">Peter Bekana</p>
            <p class="contact-title">Software Developer</p>

            <div class="contact-row">
                <span class="contact-label">Email</span>
                <a href="mailto:bpeter@gmail.com">bpeter@gmail.com</a>
            </div>
            <div class="contact-row">
                <span class="contact-label">Phone</span>
                <span>+1 555 123 4567</span>
            </div>
            <div class="contact-row">
                <span class="contact-label">LinkedIn</span>
                <a href="https://linkedin.com/in/peterbekana" target="_blank">
                    linkedin.com/in/peterbekana
                </a>
            </div>
            <div class="contact-row">
                <span class="contact-label">GitHub</span>
                <a href="https://github.com/peterbekana" target="_blank">
                    github.com/peterbekana
                </a>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
